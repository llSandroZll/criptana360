<!-- Particle Generator Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particles');
            const colors = ['#D4AF37', '#0047AB', '#ffffff']; // Gold, Blue, White
            const particleCount = window.innerWidth > 768 ? 50 : 30;

            for (let i = 0; i < particleCount; i++) {
                createParticle(container, colors);
            }
        });

        function createParticle(container, colors) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Randomize properties
            const size = Math.random() * 6 + 2; // 2px to 8px
            const color = colors[Math.floor(Math.random() * colors.length)];
            const left = Math.random() * 100; // 0% to 100%
            const duration = Math.random() * 3 + 2; // 2s to 5s
            const delay = Math.random() * 5; // 0s to 5s

            // Apply styles
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.backgroundColor = color;
            particle.style.left = `${left}vw`;
            particle.style.bottom = `-10px`;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${delay}s`;
            
            // Add subtle glow based on color
            if(color === '#D4AF37') {
                particle.style.boxShadow = `0 0 8px ${color}`;
            } else if (color === '#0047AB') {
                particle.style.boxShadow = `0 0 6px ${color}`;
            }

            container.appendChild(particle);
            
            // Recreate particle when animation ends to keep it looping infinitely
            particle.addEventListener('animationend', () => {
                particle.remove();
                createParticle(container, colors);
            });
        }
    </script>
